# Render Blueprint — patrz https://render.com/docs/blueprint-spec
#
# Zamiast tego pliku można też skonfigurować serwis ręcznie w dashboardzie
# Render, ustawiając "Root Directory" na `helper-app`. Ten plik jest
# opcjonalny, ale pozwala odtworzyć konfigurację jednym kliknięciem
# ("New > Blueprint" w Render, wskazując ten branch/repo).
#
# UWAGA: darmowy plan PostgreSQL na Render bywa czasowy (baza wygasa po
# pewnym czasie nieużywania) — sprawdź aktualny cennik/regulamin przed
# oparciem na nim produkcji.

databases:
  - name: garbarniatv-db
    plan: free
    databaseName: garbarniatv
    user: garbarniatv

services:
  - type: web
    # Wyznacza publiczny adres: https://garbarniatv.onrender.com — o ile ta
    # nazwa jest wolna globalnie na Render (bardzo prawdopodobne, to
    # niegeneryczna nazwa). Gdyby jednak była zajęta, Render poprosi o inną
    # przy tworzeniu serwisu — nazwę można też zmienić ręcznie w dashboardzie
    # po utworzeniu (Settings → Name).
    name: garbarniatv
    runtime: python
    rootDir: helper-app
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: garbarniatv-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: HELPER_APP_REST_TOKEN
        sync: false
