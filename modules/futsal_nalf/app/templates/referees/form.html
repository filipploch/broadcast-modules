{% extends "base/base.html" %}
{% block title %}{{ 'Edytuj sędziego' if referee else 'Dodaj sędziego' }}{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">
        <span>{{ 'Edytuj sędziego' if referee else 'Nowy sędzia' }}</span>
    </div>
    <form method="POST">
        <div class="form-group">
            <label for="last_name">Nazwisko *</label>
            <input type="text" id="last_name" name="last_name"
                   value="{{ referee.last_name if referee else '' }}"
                   required maxlength="100" placeholder="np. Nowak">
        </div>
        <div class="form-group">
            <label for="first_name">Imię *</label>
            <input type="text" id="first_name" name="first_name"
                   value="{{ referee.first_name if referee else '' }}"
                   required maxlength="100" placeholder="np. Adam">
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-success">✅ Zapisz</button>
            <a href="{{ url_for('list_referees') }}" class="btn btn-secondary">Anuluj</a>
        </div>
    </form>
</div>
{% endblock %}
