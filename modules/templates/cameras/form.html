{% extends "base/base.html" %}
{% block title %}{{ 'Edytuj kamerę' if camera else 'Dodaj kamerę' }}{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">
        <span>{{ 'Edytuj kamerę' if camera else 'Nowa kamera' }}</span>
    </div>
    <form method="POST">
        <div class="form-group">
            <label for="name">Nazwa *</label>
            <input type="text" id="name" name="name"
                   value="{{ camera.name if camera else '' }}"
                   required maxlength="100" placeholder="np. Kamera główna">
        </div>
        <div class="form-group">
            <label for="brand">Marka *</label>
            <input type="text" id="brand" name="brand"
                   value="{{ camera.brand if camera else '' }}"
                   required maxlength="50" placeholder="np. GoPro">
        </div>
        <div class="form-group">
            <label for="model">Model *</label>
            <input type="text" id="model" name="model"
                   value="{{ camera.model if camera else '' }}"
                   required maxlength="100" placeholder="np. Hero 12">
        </div>
        <div class="form-group">
            <label for="cam_head_id">Głowica pan/tilt</label>
            <select id="cam_head_id" name="cam_head_id">
                <option value="">— brak (kamera stacjonarna) —</option>
                {% for ch in cam_heads %}
                <option value="{{ ch.id }}"
                    {% if camera and camera.cam_head_id == ch.id %}selected{% endif %}>
                    {{ ch.name or ch.head_id }} ({{ ch.head_id }})
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="gopro_ssid">GoPro WiFi SSID</label>
            <input type="text" id="gopro_ssid" name="gopro_ssid"
                   value="{{ camera.gopro_ssid if camera and camera.gopro_ssid else '' }}"
                   maxlength="100" placeholder="np. GP24680123">
        </div>
        <div class="form-group">
            <label for="gopro_password">GoPro WiFi hasło</label>
            <input type="password" id="gopro_password" name="gopro_password"
                   value="{{ camera.gopro_password if camera and camera.gopro_password else '' }}"
                   maxlength="100" placeholder="hasło WiFi kamery">
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-success">✅ Zapisz</button>
            <a href="{{ url_for('list_cameras') }}" class="btn btn-secondary">Anuluj</a>
        </div>
    </form>
</div>
{% endblock %}
