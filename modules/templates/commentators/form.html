{% extends "base/base.html" %}
{% block title %}{{ 'Edytuj komentatora' if commentator else 'Dodaj komentatora' }}{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">
        <span>{{ 'Edytuj komentatora' if commentator else 'Nowy komentator' }}</span>
    </div>
    <form method="POST">
        <div class="form-group">
            <label for="last_name">Nazwisko *</label>
            <input type="text" id="last_name" name="last_name"
                   value="{{ commentator.last_name if commentator else '' }}"
                   required maxlength="100" placeholder="np. Wiśniewski">
        </div>
        <div class="form-group">
            <label for="first_name">Imię *</label>
            <input type="text" id="first_name" name="first_name"
                   value="{{ commentator.first_name if commentator else '' }}"
                   required maxlength="100" placeholder="np. Piotr">
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-success">✅ Zapisz</button>
            <a href="{{ url_for('list_commentators') }}" class="btn btn-secondary">Anuluj</a>
        </div>
    </form>
</div>
{% endblock %}
