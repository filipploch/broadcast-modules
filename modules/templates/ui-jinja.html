<!DOCTYPE html>
<html lang="pl">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/ui.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/plugins-states.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/reversible-elements.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/scoreboard.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/game-field.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/events-controllers.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/overlay-switcher.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/event-edit.css') }}">
	<style>
		.game-field-cell     { background-image: url({{ url_for('static', filename='images/field/empty.png') }}) }
		.game-field-selector { background-image: url({{ url_for('static', filename='images/field/football.png') }}) }
	</style>
	<title>UI – sterowanie transmisją</title>
</head>

<body>
	<div id="container2">

		<!-- ── Kolumna: status pluginów + nakładki + kontroler zdarzeń ── -->
		<div style="width:222px; height: 100vh;">

			<div class="top-bar">
				<button id="nav-to-period-control" class="top-bar-element wingdings">
					<a href="/game-setup">⚙</a>
				</button>
			</div>

			<div id="plugins-states-container" style="display: flex;">
				<div id="timer-state" class="plugin-state status-false" data-plugin-for="timer-plugin">
					<img src="{{ url_for('static', filename='images/timer.svg') }}"
						class="filter-gray" alt="T" height="30" width="30"/>
				</div>
				<div id="recorder-state" class="plugin-state status-false" data-plugin-for="recorder-plugin">
					<img src="{{ url_for('static', filename='images/floppy-disk.svg') }}"
						class="filter-gray" alt="R" height="30" width="30"/>
				</div>
				<div id="obs-ws-state" class="plugin-state status-false" data-plugin-for="obs-ws-plugin">
					<img src="{{ url_for('static', filename='images/ObsLogo.svg') }}"
						class="filter-gray" alt="O" height="30" width="30"/>
				</div>
			</div>

			<div id="cameras-states-container" style="display: flex;">
				<div>
					<div id="obs-recording-indicator" class="recording-indicator">
						<img src="{{ url_for('static', filename='images/handycam-obs.svg') }}"
							class="filter-gray" alt="O" height="19" width="19"/>
					</div>
					<div class="pan-tilt-head-status"></div>
				</div>
				<div>
					<div id="camera1-recording-indicator" class="recording-indicator" data-camera-id="camera1">
						<img src="{{ url_for('static', filename='images/handycam1.svg') }}"
							class="filter-gray" alt="1" height="19" width="19"/>
					</div>
					<div class="pan-tilt-head-status"></div>
				</div>
				<div>
					<div id="camera2-recording-indicator" class="recording-indicator" data-camera-id="camera2">
						<img src="{{ url_for('static', filename='images/gopro2.svg') }}"
							class="filter-gray" alt="2" height="19" width="19"/>
					</div>
					<div class="pan-tilt-head-status"></div>
				</div>
				<div>
					<div id="camera3-recording-indicator" class="recording-indicator" data-camera-id="camera3">
						<img src="{{ url_for('static', filename='images/gopro3.svg') }}"
							class="filter-gray" alt="3" height="19" width="19"/>
					</div>
					<div class="pan-tilt-head-status"></div>
				</div>
				<div>
					<div id="camera4-recording-indicator" class="recording-indicator" data-camera-id="camera4">
						<img src="{{ url_for('static', filename='images/gopro4.svg') }}"
							class="filter-gray" alt="4" height="19" width="19"/>
					</div>
					<div class="pan-tilt-head-status"></div>
				</div>
			</div>


			<div id="overlay-switchers-container">
				<div id="overlay-off" class="overlay-switcher"
					ondblclick="showOverlay('empty-container')"
					style="background-image: url({{ url_for('static', filename='images/ui/cancel.png') }})"></div>
				<div id="overlay-start-stream" class="overlay-switcher screen-container"
					ondblclick="showOverlay('start-container')"
					style="background-image: url({{ url_for('static', filename='images/ui/start.png') }})"></div>
				<div id="overlay-break-stream" class="overlay-switcher screen-container"
					ondblclick="showBreakScene()"
					style="background-image: url({{ url_for('static', filename='images/ui/half-time.png') }})"></div>
				<div id="overlay-lineup-team-a" class="overlay-switcher screen-container"
					ondblclick="showOverlay('home-team-squad-container')"
					style="background-image: url({{ url_for('static', filename='images/ui/team-a-lineup.png') }})"></div>
				<div id="overlay-lineup-team-b" class="overlay-switcher screen-container"
					ondblclick="showOverlay('away-team-squad-container')"
					style="background-image: url({{ url_for('static', filename='images/ui/team-b-lineup.png') }})"></div>
				<div id="overlay-game" class="overlay-switcher screen-container"
					ondblclick="showGameScene()"
					style="background-image: url({{ url_for('static', filename='images/ui/game.png') }})"></div>
				<div id="scale-screen" class="overlay-switcher screen-container"
					ondblclick="scaleScreen()"
					style="background-image: url({{ url_for('static', filename='images/ui/scale.png') }})"></div>
			</div>

			<div id="events-controllers-container">
				<div id="reversible-events-controllers-container" class="reversible" data-reverse-anchor>
					<div id="home-side-events-controllers-container" data-reverse-anchor
					class="side-events-controllers-container" data-reverse-anchor>
						<div id="home-save-controller" class="event-controller save-controller"
							onclick="addTeamEvent('home', 'Obrona');"
							style="background-image: url({{ url_for('static', filename='images/ui/save.png') }})"></div>
						<div id="away-goal-controller" class="event-controller goal-controller"
							onclick="addTeamEvent('away', 'Bramka');"
							style="background-image: url({{ url_for('static', filename='images/ui/goal.png') }})"></div>
						<div id="away-miss-controller" class="event-controller miss-controller"
							onclick="addTeamEvent('away', 'Pudło');"
							style="background-image: url({{ url_for('static', filename='images/ui/miss.png') }})"></div>
					</div>
					<div id="game-field" class="game-field-selector">
						<!-- komórki generowane przez gameFieldGenerator() w events-controllers.js -->
					</div>
					<div id="away-side-events-controllers-container" class="side-events-controllers-container">
						<div id="away-save-controller" class="event-controller save-controller"
							onclick="addTeamEvent('away', 'Obrona');"
							style="background-image: url({{ url_for('static', filename='images/ui/save.png') }})"></div>
						<div id="home-goal-controller" class="event-controller goal-controller"
							onclick="addTeamEvent('home', 'Bramka');"
							style="background-image: url({{ url_for('static', filename='images/ui/goal.png') }})"></div>
						<div id="home-miss-controller" class="event-controller miss-controller"
							onclick="addTeamEvent('home', 'Pudło');"
							style="background-image: url({{ url_for('static', filename='images/ui/miss.png') }})"></div>
					</div>
				</div>
				<div id="bottom-events-controllers-container">
					<div id="hahaha-controller" class="event-controller"
						onclick="addNoReplayEvent('HAHAHA')"
						style="background-image: url({{ url_for('static', filename='images/ui/hahaha.png') }})"></div>
					<div id="hidded-events-controllers-container" class="hidden">
						<div id="var-controller" class="event-controller"
							onclick="addFieldEvent('VAR');"
							style="background-image: url({{ url_for('static', filename='images/ui/var.png') }})"></div>
						<div id="foul-controller" class="event-controller"
							onclick="addFieldEvent('Faul');"
							style="background-image: url({{ url_for('static', filename='images/ui/foul.png') }})"></div>
						<div id="cancel-btn" class="event-controller"
							onclick="unselectAllGameFieldCells();"
							style="background-image: url({{ url_for('static', filename='images/ui/cancel.png') }})"></div>
					</div>
					<div id="bum-controller" class="event-controller"
						onclick="addNoReplayEvent('Bum')"
						style="background-image: url({{ url_for('static', filename='images/ui/bum.png') }})"></div>
				</div>
			</div>

		</div>

		<!-- ── Monitor zdarzeń ───────────────────────────────────────────── -->
		<div id="ui-monitor-container" style="width:420px; height: 100vh; background-color: black;">
			<div id="ui-monitor-controlls" style="display: flex;">
				<div class="flex1">
					<button type="button" onclick="showUiMonitorContent('events')">AKCJE</button>
				</div>
				{% if module_name and module_name == "garbarnia" %}
				<div class="flex1">
					<button type="button" onclick="showUiMonitorContent('substitutions')">ZMIANY</button>
				</div>
				{% endif %}
				<div class="flex1">
					<button type="button" onclick="showUiMonitorContent('games')">MECZE</button>
				</div>
				<div class="flex1">
					<button type="button" onclick="showUiMonitorContent()">X</button>
				</div>
			</div>
			<div id="ui-monitor-content" data-is-events-update-blocked="false"></div>
		</div>
		<div id="replay-controller">
			<div id="replay-pause-element" class="replay-element"
			onclick="replayPause()"
			ondblclick="replayEnd()"><img src="{{ url_for('static', filename='images/pause-icon.svg') }}"></div>
			<div id="replay-resume-element" class="replay-element"
			onclick="replayResume()"
			ondblclick="replayEnd()"><img src="{{ url_for('static', filename='images/play-icon.svg') }}"></div>
		</div>

	</div>
	<div id="flash-msg-display" style="display: none;"></div>

	<script>
		var period = {{ period.to_dict() | tojson if period else 'null' }};
		var game   = {{ game.to_dict()   | tojson if game   else 'null' }};
	</script>

	<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
	<script src="{{ url_for('static', filename='js/data.js') }}"></script>
	<script src="{{ url_for('static', filename='js/utils.js') }}"></script>
	<script src="{{ url_for('static', filename='js/ui-modal.js') }}"></script>
	<script src="{{ url_for('static', filename='js/event-popup.js') }}"></script>
	<script src="{{ url_for('static', filename='js/ui-jinja.js') }}"></script>
	<script src="{{ url_for('static', filename='js/plugins-states.js') }}"></script>
	<script src="{{ url_for('static', filename='js/overlay-utils.js') }}"></script>
	<script src="{{ url_for('static', filename='js/events-controllers.js') }}"></script>
	<script src="{{ url_for('static', filename='js/replay-utils.js') }}"></script>
	<script src="{{ url_for('static', filename='js/servo-utils.js') }}"></script>
</body>

</html>
