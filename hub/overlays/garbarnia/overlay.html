<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Overlay - Futsal NALF</title>
    <link rel="stylesheet" href="/overlays/garbarnia/css/main.css">
    <link rel="stylesheet" href="/overlays/garbarnia/css/classes.css">
    <link rel="stylesheet" href="/overlays/garbarnia/css/scoreboard.css">
    <link rel="stylesheet" href="/overlays/garbarnia/css/timer.css">
    <link rel="stylesheet" href="/overlays/garbarnia/css/animation-rotate-hide-element-keyframes.css">
    <link rel="stylesheet" href="/overlays/garbarnia/css/animation-rotate-show-element-keyframes.css">
    <link rel="stylesheet" href="/overlays/garbarnia/css/animation-rotate-show-element.css">
    <link rel="stylesheet" href="/overlays/garbarnia/css/game-container.css">
    <link rel="stylesheet" href="/overlays/garbarnia/css/squad.css">
    <link rel="stylesheet" href="/overlays/garbarnia/css/break.css">
    <link rel="stylesheet" href="/overlays/garbarnia/css/animate-word.css">
    <link rel="stylesheet" href="/overlays/garbarnia/css/action.css">
    <link rel="stylesheet" href="/overlays/garbarnia/css/shootout.css">
    <link rel="stylesheet" href="/overlays/garbarnia/css/substitution.css">
    <link rel="stylesheet" href="/overlays/garbarnia/css/results.css">
    <link rel="stylesheet" href="/overlays/garbarnia/css/specific.css">
</head>
<body>
    <div id="empty-container" style="display: none;"></div>
    <div id="game-container" class="overlay-container game-container" style="display: none;">
        <div id="scoreboard-container">
            <div id="top-scoreboard-container" class="scoreboard-row">
                <div></div>
                <div id="home-team-red-cards" class="team-fouls"></div>
                <div></div>
                <div></div>
                <div></div>
                <div id="away-team-red-cards" class="team-fouls"></div>
            </div>
            <div id="main-scoreboard-container" class="scoreboard-row">
                <div id="main-timer-display" class="specific-colors"></div>
                <div class="team-box">
                    <div id="home-team-shortname" class="team-name home-team-shortname"></div>
                    <div id="home-team-uniform" class="team-uniform home-team-uniform"></div>
                </div>
                <div id="home-team-score" class="team-score home-team-score"> </div>
                <div></div>
                <div id="away-team-score" class="team-score away-team-score"> </div>
                <div class="team-box">
                    <div id="away-team-shortname" class="team-name away-team-shortname">TEB</div>
                    <div id="away-team-uniform" class="team-uniform away-team-uniform"></div>
                </div>
            </div>
            <div id="bottom-scoreboard-container" class="scoreboard-row">
                <div></div>
                <div id="home-team-penalty-timer-container" class="penalty-timer-container">
                    <!-- <div class="penalty-timer">0:22</div>
                    <div class="penalty-timer">0:22</div> -->
                </div>
                <div></div>
                <div></div>
                <div></div>
                <div id="away-team-penalty-timer-container" class="penalty-timer-container">
                    <!-- <div class="penalty-timer">0:22</div>
                    <div class="penalty-timer">0:22</div> -->
                </div>
            </div>
        </div>
        <div id="animationArea"><span style="color: rgba(255,255,255,0)">.</span></div>
		<div id="action_info_container">
			<div class="action_square" id="action_icon"><img id="action_icon_img"></div>
			<div id="action_info_text">
				<div class="action_minute"><span id="action_time"></span></div>
				<div id="action_player">
                    <span id="action_player_name"></span>
                    <span id="action_player_team_short_name"></span>
                </div>
				<div class="action_minute invisible_text"></div>
				<div class="cleaner"></div>
				<div id="action_team_name"></div>
			</div>
			<div class="action_square"><p></p></div>
		</div>
        <div id="substitutions-container" style="display: none;">
            <div id="substitutions">
                <div id="substitution-header" class="substitution substitution-row"></div>
            </div>
        </div>
        <div id="results-table-container" style="display: none;">
            <div class="results">
                <div id="results-header" class="results-row rotate-show-element0">WYNIKI</div>
                <div class="results-row rotate-show-element1">
                    <div class="results-home-team-name14 results-team-name14">Garbarnia</div>
                    <div class="results-home-team-result results-team-result">20</div>
                    <div class="results-separator">-</div>
                    <div class="results-away-team-result results-team-result">0</div>
                    <div class="results-away-team-name14 results-team-name14">Kalwarianka</div>
                </div>
            </div>
        </div>
        <div id="banner-container" style="display:none; position: absolute; left: 710px; bottom:0px; overflow: hidden; width: 500px; height: 100px; margin:0; padding:0;"></div>
    </div>
    <div id="start-container" class="start-container info-container overlay-container" style="display: none;"></div>
    <div id="break-container" class="break-container info-container overlay-container" style="display: none;"></div>
    <div id="home-team-squad-container" class="squad-container info-container overlay-container" style="display: none;"></div>
    <div id="away-team-squad-container" class="squad-container info-container overlay-container" style="display: none;"></div>
    <div id="shootout-container" class="shootout-container overlay-container" style="display: none;"></div>
    <script src="/overlays/garbarnia/js/utils.js"></script>
    <script src="/overlays/garbarnia/js/squad.js"></script>
    <script type="application/javascript" src="/overlays/garbarnia/js/animate-word.js"></script>
    <script src="/overlays/garbarnia/js/formatters.js"></script>
	<script src="/overlays/garbarnia/js/penalty-timers-observers.js"></script>
	<script src="/overlays/garbarnia/js/shootout.js"></script>
	<script src="/overlays/garbarnia/js/specific.js"></script>
	<script src="/overlays/garbarnia/js/substitution.js"></script>
	<script src="/overlays/garbarnia/js/overlay.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
	<script src="/overlays/garbarnia/js/banners/functions.js"></script>

</body>
</html>
