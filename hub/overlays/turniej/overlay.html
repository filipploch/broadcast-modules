<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Overlay - Turniej</title>
    <link rel="stylesheet" href="/overlays/turniej/css/main.css">
    <link rel="stylesheet" href="/overlays/turniej/css/classes.css">
    <link rel="stylesheet" href="/overlays/turniej/css/scoreboard.css">
    <link rel="stylesheet" href="/overlays/turniej/css/timer.css">
    <link rel="stylesheet" href="/overlays/turniej/css/animation-rotate-hide-element-keyframes.css">
    <link rel="stylesheet" href="/overlays/turniej/css/animation-rotate-show-element-keyframes.css">
    <link rel="stylesheet" href="/overlays/turniej/css/animation-rotate-show-element.css">
    <link rel="stylesheet" href="/overlays/turniej/css/game-container.css">
    <link rel="stylesheet" href="/overlays/turniej/css/squad.css">
    <link rel="stylesheet" href="/overlays/turniej/css/animate-word.css">
    <link rel="stylesheet" href="/overlays/turniej/css/action.css">
    <link rel="stylesheet" href="/overlays/turniej/css/substitution.css">
    <link rel="stylesheet" href="/overlays/turniej/css/results.css">
    <link rel="stylesheet" href="/overlays/turniej/css/specific.css">
</head>
<body>
    <div id="empty-container" style="display: none;"></div>
    <div id="game-container" class="overlay-container game-container" style="display: none;">
        <div id="scoreboard-container">
            <div id="top-scoreboard-container" class="scoreboard-row">
                <div></div>
                <div id="home-team-fouls" class="team-fouls"></div>
                <div></div>
                <div></div>
                <div></div>
                <div id="away-team-fouls" class="team-fouls"></div>
            </div>
            <div id="main-scoreboard-container" class="scoreboard-row">
                <div id="main-timer-display" class="specific-colors"></div>
                <div class="team-box">
                    <div id="home-team-shortname" class="team-name home-team-shortname"></div>
                    <div id="home-team-uniform" class="team-uniform home-team-uniform"></div>
                </div>
                <div id="home-team-score" class="team-score home-team-score"> </div>
                <div></div>
                <div id="away-team-score" class="team-score away-team-score"> </div>
                <div class="team-box">
                    <div id="away-team-shortname" class="team-name away-team-shortname"></div>
                    <div id="away-team-uniform" class="team-uniform away-team-uniform"></div>
                </div>
            </div>
            <div id="bottom-scoreboard-container" class="scoreboard-row">
                <div></div>
                <div id="home-team-penalty-timer-container" class="penalty-timer-container">
                </div>
                <div></div>
                <div></div>
                <div></div>
                <div id="away-team-penalty-timer-container" class="penalty-timer-container">
                </div>
            </div>
            <div id="penalty-score-row" style="display:none; justify-content:center; align-items:center; font-size:1.4vw; color:#fff; padding:2px 0; letter-spacing:.05em;">
                K: <span id="penalty-home">0</span>&nbsp;–&nbsp;<span id="penalty-away">0</span>
            </div>
        </div>
        <div id="animationArea"><span style="color: rgba(255,255,255,0)">.</span></div>
		<div id="action_info_container">
			<div class="action_square" id="action_icon"><img id="action_icon_img"></div>
			<div id="action_info_text">
				<div class="action_minute"><span id="action_time"></span></div>
				<div id="action_player">
                    <span id="action_player_name"></span>
                    <span id="action_player_team_short_name"></span>
                </div>
				<div class="action_minute invisible_text"></div>
				<div class="cleaner"></div>
				<div id="action_team_name"></div>
			</div>
			<div class="action_square"><p></p></div>
		</div>
        <div id="substitutions-container" style="display: none;">
            <div id="substitutions">
                <div id="substitution-header" class="substitution substitution-row"></div>
            </div>
        </div>
        <div id="results-table-container" style="display: none;">
            <div class="results">
                <div id="results-header" class="results-row rotate-show-element0">WYNIKI</div>
                <div class="results-row rotate-show-element1">
                    <div class="results-home-team-name14 results-team-name14"></div>
                    <div class="results-home-team-result results-team-result"></div>
                    <div class="results-separator">-</div>
                    <div class="results-away-team-result results-team-result"></div>
                    <div class="results-away-team-name14 results-team-name14"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="start-container" class="start-container info-container overlay-container" style="display: none;"></div>
    <div id="break-container" class="break-container info-container overlay-container" style="display: none;"></div>
    <div id="home-team-squad-container" class="squad-container info-container overlay-container" style="display: none;"></div>
    <div id="away-team-squad-container" class="squad-container info-container overlay-container" style="display: none;"></div>
    <script src="/overlays/turniej/js/utils.js"></script>
    <script src="/overlays/turniej/js/squad.js"></script>
    <script type="application/javascript" src="/overlays/turniej/js/animate-word.js"></script>
    <script src="/overlays/turniej/js/formatters.js"></script>
	<script src="/overlays/turniej/js/penalty-timers-observers.js"></script>
	<script src="/overlays/turniej/js/specific.js"></script>
	<script src="/overlays/turniej/js/substitution.js"></script>
	<script src="/overlays/turniej/js/overlay.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
	<script src="/overlays/turniej/js/banners/functions"></script>


</body>
</html>
