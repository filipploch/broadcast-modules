<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/preview.css">

</head>

<body>
    <div class="no-facebook" style="background-color: rgba(255,255,255,0.2);">
        <span></span>
    </div>
    <div class="facebook" style="background-color: rgba(255,255,255,0.2);">
        <div class="section-match-info">
            <div class="match-info">
                <!-- <div class="clear_line">*</div> -->
                <div class="nalf-logo"><img id="nalf-logo" src=""></div>
                <div class="clear_line">*</div>
                <div class="match-teams">
                    <div class="team-logo" id="team_a_logo">
                        <img id="home_team_logo" src="" class="logo">
                    </div>
                    <div class="team-logo" id="team_b_logo">
                        <img id="away_team_logo" src="" class="logo">
                    </div>
                    <div style="clear: both;"></div>
                </div>
                <div class="clear_line">*</div>
                <div class="team_full_name shadow" id="home_team_name"></div>
                <div class="clear_line">*</div>
                <div class="team_full_name shadow" id="away_team_name"></div>
                <div class="clear_line">*</div>
                <div class="match_date shadow" id="date"></div>
                <div class="clear_line">*</div>
                <div class="match_date shadow">youtube.com/@NALFVideo</div>
                <div class="clear_line">*</div>
                <div class="match-hashtag attention shadow">
                    <span>#NALFx31</span>
                    <span>#<span id="home_team_short_name"></span>x<span id="away_team_short_name"></span></span> 
                </div>
                <div class="bottom-mask"></div>
            </div>
            <div class="attention shadow" id="division"></div>

        </div>
        
        <div class="logos">
            <img id="logos-img" src="">
        </div>
    </div>
    <div class="no-facebook" style="background-color: rgba(255,255,255,0.2);">
        <span></span>
    </div>
    
    <script src="/overlays/futsal-nalf/js/utils.js"></script>
    <script src="/overlays/futsal-nalf/js/preview.js"></script>
</body>
</html>
