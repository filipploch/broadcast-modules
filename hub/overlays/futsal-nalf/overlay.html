<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Overlay - Futsal NALF</title>
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/main.css">
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/classes.css">
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/scoreboard.css">
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/timer.css">
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/team-squad.css">
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/animation-rotate-table-row-keyframes.css">
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/animation-rotate-table-row-elements.css">
</head>
<body>
    <!-- <div id="game-screen-container" class="overlay-container hidden"> -->
    <div id="game-screen-container" class="overlay-container">
        <div id="scoreboard-container">
            <div id="top-scoreboard-container" class="scoreboard-row">
                <div></div>
                <div id="home-team-fouls" class="team-fouls">●●●●●</div>
                <div></div>
                <div></div>
                <div></div>
                <div id="away-team-fouls" class="team-fouls">■■■■■</div>
            </div>
            <div id="main-scoreboard-container" class="scoreboard-row">
                <div id="main-timer-display">00:00</div>
                <div class="team-box">
                    <div id="home-team-shortname" class="team-name home-team-shortname">TEA</div>
                    <div id="home-team-uniform" class="team-uniform">
                        <div class="flex1 team-uniform-element" style="background-color: rgb(255, 255, 255);">.</div>
                        <div class="flex1 team-uniform-element" style="background-color: rgb(0, 132, 70);">.</div>
                    </div>
                </div>
                <div id="home-team-score" class="team-score">18</div>
                <div></div>
                <div id="away-team-score" class="team-score">1</div>
                <div class="team-box">
                    <div id="away-team-shortname" class="team-name away-team-shortname">TEB</div>
                    <div id="away-team-uniform" class="team-uniform">
                        <div class="flex1 team-uniform-element" style="background-color: blue;">.</div>
                        <div class="flex1 team-uniform-element" style="background-color: white;">.</div>
                        <div class="flex1 team-uniform-element" style="background-color: blue;">.</div>
                    </div>
                </div>
            </div>
            <div id="bottom-scoreboard-container" class="scoreboard-row">
                <div></div>
                <div id="home-team-penalty-timer-container" class="penalty-timer-container">
                    <!-- <div class="penalty-timer">0:22</div>
                    <div class="penalty-timer">0:22</div> -->
                </div>
                <div></div>
                <div></div>
                <div></div>
                <div id="away-team-penalty-timer-container" class="penalty-timer-container">
                    <!-- <div class="penalty-timer">0:22</div>
                    <div class="penalty-timer">0:22</div> -->
                </div>
            </div>
        </div>
        <div id="away-team-squad-container">
            <table id="away-team-squad-table"></table>
        </div>
    </div>
    <script src="/overlays/futsal-nalf/js/utils.js"></script>
    <script src="/overlays/futsal-nalf/js/formatters.js"></script>
    
    <script>
    // WebSocket z rejestracją jako overlay + subskrypcja timer
    const overlayId = 'stream-overlay';
    const ws = new WebSocket(`ws://${window.location.hostname}:${window.location.port}/ws`);
    
    const display = document.getElementById('main-timer-display');
    
    let registered = false;

    function createTeamSquad(arr) {
        var tableBody = document.createElement('tbody');
        tableBody.innerHTML = '';

        arr.forEach(function(element, index) {
            var goalkeeper = '';
            var captain = '';
            if (element.is_goalkeeper === true){
                goalkeeper = ' B '
            }
            if (element.is_captain === true){
                captain = ' C '
            }
            var tableRow = document.createElement('tr');
            addClassName(tableRow, 'squad-player-row');
            addClassName(tableRow, 'rotate-table-row');
            addClassName(tableRow, `rotate-table-row${index}`);
            tableRow.innerHTML = `<td class="squad-player-number">${element.number}</td><td class="squad-player-name">${element.player_name}</td><td class="squad-player-func">${goalkeeper}${captain}</td>`;
            tableBody.appendChild(tableRow);
        });
        return tableBody;
    }

    function updateScoreboard(data) {
        let homeTeamScoreElement = document.getElementById('home-team-score');
        let awayTeamScoreElement = document.getElementById('away-team-score');
        let homeTeamFoulsElement = document.getElementById('home-team-fouls');
        let awayTeamFoulsElement = document.getElementById('away-team-fouls');
        if (typeof data.home_team_goals != "undefined") {
            if(data.home_team_goals === '' || data.home_team_goals === null){
                homeTeamScoreElement.textContent = '';
            }else if(parseInt(data.home_team_goals) !== 'undefined'){
                homeTeamScoreElement.textContent = data.home_team_goals;
            }else{
                
            }
        }
        if (typeof data.away_team_goals != "undefined") {
            if(data.away_team_goals === '' || data.away_team_goals === null){
                awayTeamScoreElement.textContent = '';
            }else if(parseInt(data.home_team_goals) !== 'undefined'){
                awayTeamScoreElement.textContent = data.away_team_goals;
            }else{
                
            }
        }
        if (typeof data.home_team_fouls != "undefined") {
            if(data.home_team_fouls === '' || data.home_team_fouls === null){
                homeTeamFoulsElement.textContent = '';
            }else if(parseInt(data.home_team_fouls) !== 'undefined' &&
                data.home_team_fouls >= 0 &&
                data.home_team_fouls < 6){
                    homeTeamFoulsElement.textContent = '●'.repeat(data.home_team_fouls);
                    homeTeamFoulsElement.style.color = 'yellow';
                    if(data.home_team_fouls > 4){
                        homeTeamFoulsElement.style.color = 'red';
                    }else if(data.home_team_fouls < 4){
                        homeTeamFoulsElement.style.color = 'white';
            }else{
                
            }
        }}
        if (typeof data.away_team_fouls != "undefined") {
            if(data.away_team_fouls === '' || data.away_team_fouls === null){
                awayTeamFoulsElement.textContent = '';
            }else if(parseInt(data.away_team_fouls) !== 'undefined' &&
                data.away_team_fouls >= 0 &&
                data.away_team_fouls < 6){
                    awayTeamFoulsElement.textContent = '●'.repeat(data.away_team_fouls);
                    awayTeamFoulsElement.style.color = 'yellow';
                    if(data.away_team_fouls > 4){
                        awayTeamFoulsElement.style.color = 'red';
                    }else if(data.away_team_fouls < 4){
                        awayTeamFoulsElement.style.color = 'white';
                    }else{}
            }else{
                
            }
        }
    }
    
    ws.onopen = () => {
        console.log('✅ Connected to HUB');
        
        ws.send(JSON.stringify({
            type: 'register',
            from: overlayId,
            to: 'hub',
            payload: {
                id: overlayId,
                component_type: 'overlay',
                type: 'overlay'
            }
        }));
    };
    
    ws.onclose = () => {
        console.log('❌ Disconnected from HUB');
        setTimeout(() => location.reload(), 3000);
    };
    
    ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        console.log('📨 Received:', msg.type, msg);
        
        // Po rejestracji → subskrybuj timer
        if (msg.type === 'registered' && !registered) {
            registered = true;
            console.log('✅ Registered! Now subscribing to timer...');

            ws.send(JSON.stringify({
                type: 'subscribe',
                from: overlayId,
                to: 'hub',
                payload: {
                    class: ['timer', 'overlay', 'timer_update_receiver', 'timer_state_receiver', 'game_data_receiver']
                }
            }));

            ws.send(JSON.stringify({
                type: 'request_game_data',
                from: overlayId,
                to: 'futsal-nalf'
            }));
        }
        
        // Po subskrypcji
        if (msg.type === 'subscribed') {
            console.log('✅ Subscribed to classes!');
            
        }
        
        // OBSŁUGA TIMERÓW
        if (msg.type === 'timer_updated') {
            const data = msg.payload || msg.data;
            
            // Sprawdź czy to timer karny
            if (data.timer_id && data.timer_id.startsWith('penalty_')) {
                const timerId = data.timer_id;
                const currentTime = data.elapsed_time_formatted || 
                                   FutsalFormatters.formatRemaining(data.elapsed_time, data.limit);
                
                if (data.state === 'running' || data.state === 'paused') {
                    // Utwórz lub zaktualizuj timer
                    const existingTimer = window.PenaltyTimers?.create(timerId, currentTime);
                    if (existingTimer) {
                        // Jeśli timer już istniał, funkcja create zwróci istniejący element
                        // i nie utworzy nowego, więc musimy zaktualizować czas
                        if (penaltyTimers?.has(timerId)) {
                            window.PenaltyTimers.update(timerId, currentTime);
                        }
                    }
                } else if (data.state === 'stopped') {
                    // Usuń timer jeśli jest zatrzymany
                    window.PenaltyTimers?.remove(timerId);
                }
            } else {
                // To jest główny timer meczu
                const formatted = FutsalFormatters.formatElapsedTime(data.elapsed_time);
                display.textContent = formatted;
                console.log(`⏱️ Main Timer: ${formatted} [${data.state}]`);
            }
        }
        
        // OBSŁUGA SYGNAŁU LIMIT_REACHED
        if (msg.type === 'limit_reached') {
            const data = msg.payload || msg.data;
            
            // Sprawdź czy to dotyczy timera karnego
            if (data.timer_id && data.timer_id.startsWith('penalty_')) {
                console.log(`🏁 Limit reached for penalty timer: ${data.timer_id}`);
                window.PenaltyTimers?.remove(data.timer_id);
            }
        }
        
        // NOWA OBSŁUGA: SYGNAŁ TIMER_REMOVED
        if (msg.type === 'timer_removed') {
            const data = msg.payload || msg.data;
            
            // Sprawdź czy to dotyczy timera karnego
            if (data.timer_id && data.timer_id.startsWith('penalty_')) {
                console.log(`🗑️ Timer removed signal for: ${data.timer_id}`);
                window.PenaltyTimers?.remove(data.timer_id);
            }
        }

        if (msg.type === 'show_overlay_container') {
            const data = msg.payload || msg.data;
            
            // Sprawdź czy to dotyczy timera karnego
            showOverlay('game-screen-container');
        }

        if(msg.type === 'scoreboard_data') {
            const data = msg.payload || msg.data;
            updateScoreboard(data);
        }

        if (msg.type === 'game_data') {
            const data = msg.payload || msg.data;
            console.log('game_data', data);
            let homeTeamShortNameElements = document.querySelectorAll('.home-team-shortname');
            let awayTeamShortNameElements = document.querySelectorAll('.away-team-shortname');
            let awayTeamSquadContainer = document.getElementById('away-team-squad-container');

            console.log('short Name:', data.away_team_short_name)
            if (typeof data.home_team_short_name != "undefined") {
                homeTeamShortNameElements.forEach(element => {
                    element.textContent = data.home_team_short_name;
                })
            }
            
            if (typeof data.away_team_short_name != "undefined") {
                awayTeamShortNameElements.forEach(element => {
                    element.textContent = data.away_team_short_name;
                })
            }

            if (typeof data.away_team_squad != "undefined") {
                var squad = data.away_team_squad;
                var elems = createTeamSquad(squad);
                document.querySelector('#away-team-squad-table').append(elems);
            }


        }
    }

    // Opcjonalnie: czyszczenie timerów przy odświeżeniu strony
    // window.addEventListener('beforeunload', () => {
    //     window.PenaltyTimers?.clearAll();
    // });
</script>
	<script src="/overlays/futsal-nalf/js/penalty-timers-observers.js"></script>
</body>
</html>
