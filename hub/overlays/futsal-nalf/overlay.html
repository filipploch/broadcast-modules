<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Overlay - Futsal NALF</title>
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/main.css">
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/classes.css">

    <link rel="stylesheet" href="/overlays/futsal-nalf/css/timer.css">
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/animation-rotate-hide-element-keyframes.css">
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/animation-rotate-show-element-keyframes.css">
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/animation-rotate-show-element.css">
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/game-container.css">
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/squad.css">
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/animate-word.css">
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/action.css">
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/shootout.css">
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/substitution.css">
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/results.css">
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/specific.css">
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/overlay-container.css">
    <link rel="stylesheet" href="/overlays/futsal-nalf/css/scoreboard-new.css">
</head>
<body>
    <div id="empty-container" style="display: none;"></div>
    <div id="game-container" class="overlay-container game-container" style="display: none;">
        <div id="scoreboard-container">
            <div id="top-scoreboard">
                <div id="home-team-fouls-container" class="fouls-container">
                    <div id="home-team-fouls" class="team-fouls"></div>
                </div>
                <div id="main-timer-display"></div>
                <div id="away-team-fouls-container" class="fouls-container">
                    <div id="away-team-fouls" class="team-fouls"></div>
                </div>
            </div>
            <div id="main-scoreboard">
                <div id="home-container">
                    <div class="team-box">
                        <div id="home-team-uniform" class="team-uniform home-team-uniform"></div>
                        <div id="home-team-shortname" class="team-name home-team-shortname"></div>
                    </div>
                    <div id="home-team-score" class="team-score home-team-score"></div>
                </div>
                <div id="nalf-logo">
                    <img id="nalf-logo-img" class="logo-img" src="">
                </div>
                <div id="away-container">
                    <div id="away-team-score" class="team-score away-team-score"></div>
                    <div class="team-box">
                        <div id="away-team-uniform" class="team-uniform away-team-uniform"></div>
                        <div id="away-team-shortname" class="team-name away-team-shortname"></div>
                    </div>
                </div>
            </div>
            <div id="bottom-scoreboard">
                <div id="home-team-penalty-timer-container" class="penalty-timer-container"></div>
                <div id="scoreboard-game-info">
                    <div id="scoreboard-season-info" class="scoreboard-game-info-slide"></div>
                    <div id="scoreboard-league-info" class="scoreboard-game-info-slide"></div>
                    <div id="scoreboard-round-info"  class="scoreboard-game-info-slide"></div>
                </div>
                <div id="away-team-penalty-timer-container" class="penalty-timer-container"></div>
            </div>
        </div>
        <div id="animationArea"><span style="color: rgba(255,255,255,0)">.</span></div>
		<div id="action_info_container">
			<div class="action_square" id="action_icon"><img id="action_icon_img"></div>
			<div id="action_info_text">
				<div class="action_minute"><span id="action_time"></span></div>
				<div id="action_player">
                    <span id="action_player_name"></span>
                    <span id="action_player_team_short_name"></span>
                </div>
				<div class="action_minute invisible_text"></div>
				<div class="cleaner"></div>
				<div id="action_team_name"></div>
			</div>
			<div class="action_square"><p></p></div>
		</div>
        <div id="substitutions-container" style="display: none;">
            <div id="substitutions">
                <div id="substitution-header" class="substitution substitution-row"></div>
            </div>
        </div>
        <div id="results-table-container" style="display: none;">
            <div class="results">
                <div id="results-header" class="results-row rotate-show-element0">WYNIKI</div>
                <div class="results-row rotate-show-element1">
                    <div class="results-home-team-name14 results-team-name14">Garbarnia</div>
                    <div class="results-home-team-result results-team-result">20</div>
                    <div class="results-separator">-</div>
                    <div class="results-away-team-result results-team-result">0</div>
                    <div class="results-away-team-name14 results-team-name14">Kalwarianka</div>
                </div>
            </div>
        </div>
    </div>
    <div id="start-container" class="start-container info-container overlay-container" style="display: none;"></div>
    <div id="break-container" class="break-container info-container overlay-container" style="display: none;"></div>
    <div id="home-team-squad-container" class="squad-container info-container overlay-container" style="display: none;"></div>
    <div id="away-team-squad-container" class="squad-container info-container overlay-container" style="display: none;"></div>
    <div id="results-container" class="results-container info-container overlay-container" style="display: none;"></div>
    <div id="table-container" class="table-container info-container overlay-container" style="display: none;"></div>
    <div id="virtual-table-container" class="virtual-table-container table-container info-container overlay-container" style="display: none;"></div>
    <div id="shootout-container" class="shootout-container overlay-container" style="display: none;"></div>
    <script src="/overlays/futsal-nalf/js/scoreboard.js"></script>
    <script src="/overlays/futsal-nalf/js/utils.js"></script>
    <script src="/overlays/futsal-nalf/js/squad.js"></script>
    <script type="application/javascript" src="/overlays/futsal-nalf/js/animate-word.js"></script>
    <script src="/overlays/futsal-nalf/js/formatters.js"></script>
    <script src="/overlays/futsal-nalf/js/time-display.js"></script>
	<script src="/overlays/futsal-nalf/js/penalty-timers-observers.js"></script>
	<script src="/overlays/futsal-nalf/js/shootout.js"></script>
	<script src="/overlays/futsal-nalf/js/specific.js"></script>
	<script src="/overlays/futsal-nalf/js/substitution.js"></script>
	<script src="/overlays/futsal-nalf/js/overlay.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
	<script src="/overlays/futsal-nalf/js/banners/functions.js"></script>


</body>
</html>
